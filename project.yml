# Pal's Xcode project, generated by XcodeGen (`xcodegen generate`). Edit this, not the .xcodeproj.
name: Pal
options:
  bundleIdPrefix: app.pal
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Release scripts override these: MARKETING_VERSION from the tag, build = git commit count.
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Pal:
    type: application
    platform: macOS
    sources:
      - path: Pal
        excludes: ["Info.plist", "Pal.entitlements"]
    dependencies:
      - package: Sparkle
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Pal/Info.plist
      properties:
        CFBundleName: $(PAL_DISPLAY_NAME)
        CFBundleDisplayName: $(PAL_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Pal listens while you hold the talk key so it can answer your question.
        NSSpeechRecognitionUsageDescription: Pal turns what you say into text on your Mac.
        NSRemindersFullAccessUsageDescription: Pal reads and adds reminders when you ask.
        NSCalendarsFullAccessUsageDescription: Pal reads and adds calendar events when you ask.
        NSContactsUsageDescription: Pal looks people up when you ask.
        NSAppleEventsUsageDescription: Pal controls apps like Music and System Events when you ask.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(PAL_URL_SCHEME)]
        # Sparkle: the feed is the appcast attached to the newest GitHub release.
        SUFeedURL: https://github.com/morajabi/pal/releases/latest/download/appcast.xml
        SUPublicEDKey: $(PAL_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: Pal
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Pal/Pal.entitlements
        # Public half of the Sparkle signing key (private half: login Keychain, account "pal").
        PAL_SPARKLE_PUBLIC_KEY: zUD2WruzTLGQtnkb+f0TjWsGrOVWMm7pt5d2A9qJbNw=
      configs:
        # Dev builds are a separate app ("Pal Dev") so they never fight the installed one
        # over permissions, the pal:// scheme, data, or updates.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.pal.mac.dev
          PAL_DISPLAY_NAME: Pal Dev
          PAL_URL_SCHEME: pal-dev
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.pal.mac
          PAL_DISPLAY_NAME: Pal
          PAL_URL_SCHEME: pal
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets: [PalTests]

  # Fast unit tests for pure logic. They compile the files they test directly
  # (no app host), so they run anywhere, including CI.
  PalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PalTests
      - path: Pal/Brain/ReplyParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pal.tests
        GENERATE_INFOPLIST_FILE: YES
